name: Verify DocumentRAG
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
      - run: python -B scripts/check_backend.py
      - run: python scripts/sync_model_catalog.py --check
      - run: python scripts/sync_deployment_profiles.py --check
      - name: Root workspace verification and build
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm install
          npm run check:frontend
          npm audit
          npm run build
      - name: Browser integration
        env:
          PYTHONPATH: backend
          VITE_DEV_PROXY_TARGET: http://127.0.0.1:8999
        run: |
          npx playwright install --with-deps chromium
          python -B backend/tests/integration_server.py > /tmp/document-api.log 2>&1 &
          api_pid=$!
          (cd frontend && npm run preview -- --host 127.0.0.1 --port 5188 --strictPort) > /tmp/document-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8999/health && curl -fsS http://127.0.0.1:5188/health; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:browser || { cat /tmp/document-api.log /tmp/document-frontend.log; exit 1; }
      - run: python scripts/prepare_huggingface.py --output dist/huggingface
      - name: Verify direct Gradio upload entrypoint
        run: |
          pip install 'torch>=2.6,<=2.13.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          python -B scripts/check_backend.py
  frontend-folder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: frontend
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify standalone frontend upload/build method
        run: |
          cp -R frontend /tmp/document-frontend
          cd /tmp/document-frontend
          npm install
          npm audit
          npm run build
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate split and full-stack deployments
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env config --quiet
          docker build -t document-rag-full .
          docker compose --env-file backend/.env build
          docker compose --env-file backend/.env up -d
          trap 'docker compose --env-file backend/.env logs; docker compose --env-file backend/.env down' EXIT
          docker compose --env-file backend/.env exec -T frontend nginx -t
          curl --retry 20 --retry-connrefused --retry-delay 2 -fsS http://localhost:5173/health
